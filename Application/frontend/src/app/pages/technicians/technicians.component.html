<section class="technicians-page p-y-12 p-x-18">
  <div class="technicians-shell">
    <header class="technicians-header">
      <div>
        <h1>Majstori</h1>
      </div>
      <div class="tab-bar" role="tablist">
        <button
          type="button"
          role="tab"
          class="tab-button"
          [class.is-active]="isListActive"
          (click)="setTab(tabs.LIST)"
        >
          Lista majstora
        </button>
        <button
          type="button"
          role="tab"
          class="tab-button"
          [class.is-active]="!isListActive"
          (click)="setTab(tabs.MAP)"
        >
          Mapa
        </button>
      </div>
    </header>

    <div *ngIf="isListActive" class="technicians-list-mode">
      <label class="technicians-search">
        <input
          type="search"
          placeholder="Pretraži po imenu ili korisničkom imenu"
          (input)="onSearchInput($any($event.target).value)"
        />
      </label>

      @if (isLoading) {
      <div class="technicians-loading">Učitavanje majstora...</div>
      } @else if (loadError) {
      <div class="technicians-error" role="alert">{{ loadError }}</div>
      } @else {
      <div class="technician-grid custom-scrollbar">
        <button
          *ngFor="let technician of filteredTechnicians"
          type="button"
          class="technician-card card-hover"
          (click)="openDetail(technician.id)"
        >
          <header>
            <div>
              <h3>{{ fullName(technician) }}</h3>
              <p class="technician-card__location">
                {{ atUsername(technician) }}
              </p>
            </div>
          </header>
          <p class="technician-card__meta">Majstor</p>
          <span class="technician-card__link">Pogledaj profil →</span>
        </button>
        <p class="empty-state" *ngIf="!filteredTechnicians.length">
          Nema majstora za odabranu pretragu.
        </p>
      </div>
      }
    </div>

    <div *ngIf="!isListActive" class="technicians-map-mode">
      <app-map
        class="technicians-map__leaflet"
        [markers]="mapMarkers"
        [center]="mapCenter"
      ></app-map>
      <aside class="technicians-panel">
        <div class="technicians-panel__header">
          <h2>Panel</h2>
          <span>{{ filteredTechnicians.length }} profila</span>
        </div>
        <div class="technician-panel-list custom-scrollbar">
          <button
            *ngFor="let technician of filteredTechnicians"
            type="button"
            class="technician-card"
            (click)="openDetail(technician.id)"
          >
            <div>
              <h3>{{ fullName(technician) }}</h3>
              <p>{{ atUsername(technician) }}</p>
            </div>
          </button>
        </div>
      </aside>
    </div>
  </div>

  @if (selectedMasterIdForDetail) {
  <app-technician-detail-modal
    [masterId]="selectedMasterIdForDetail"
    (closed)="closeDetail()"
    (openCreateJob)="onOpenCreateJob($event)"
  />
  }

  @if (showCreateJobModal && createJobMaster) {
  <app-create-job-modal
    [master]="createJobMaster"
    (closed)="closeCreateJobModal()"
    (created)="onJobCreated($event)"
  />
  }
</section>
