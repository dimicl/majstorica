<div class="technician-detail-overlay" (click)="close()">
  <div class="technician-detail-modal" (click)="$event.stopPropagation()">
    <header class="technician-detail-modal__header">
      <h2 class="technician-detail-modal__title">Profil majstora</h2>
      <button
        type="button"
        class="technician-detail-modal__close"
        (click)="close(); $event.stopPropagation()"
        aria-label="Zatvori"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    </header>

    <div class="technician-detail-modal__body">
      @if (isLoading()) {
      <p class="technician-detail-modal__loading">Učitavanje...</p>
      } @else if (error()) {
      <p class="technician-detail-modal__error" role="alert">{{ error() }}</p>
      } @else { @if (master(); as m) {
      <article class="profile__card">
        <header class="profile__header">
          <div class="profile__avatar">
            <app-avatar [width]="80" [height]="80" />
          </div>
          <div class="profile__head">
            <h1 class="profile__name">{{ fullName() }}</h1>
            <p class="profile__username">
              {{ usernameWithAt(m.user.username) }}
            </p>
            <div class="profile__actions-row">
              <app-button
                [buttonType]="eButtonType.POSITIVE"
                [label]="isStartingChat() ? 'Otvaranje...' : 'Napiši poruku'"
                [disabled]="isStartingChat()"
                (onButtonClick)="onWriteMessage()"
              />
              <app-button
                [buttonType]="eButtonType.NEUTRAL"
                [label]="createJobButtonLabel()"
                [hasIcon]="false"
                [disabled]="hasRequestedThisMaster()"
                (onButtonClick)="openCreateJobModal()"
              />
            </div>
          </div>
        </header>

        <section class="profile__contact" aria-label="Kontakt">
          <h2 class="profile__section-title">Kontakt</h2>
          <div class="profile__meta-list">
            <div class="profile__meta-item">
              <span class="profile__meta-icon" aria-hidden="true"> </span>
              <!-- <span class="profile__meta-value">{{
                m.user.phone?.trim() || "No Phone"
              }}</span>
              @if (m.user.phone?.trim()) {
              <a [href]="'tel:' + m.user.phone" class="profile__link">Pozovi</a>
              } -->
            </div>
            <!-- <div class="profile__meta-item">
              <span class="profile__meta-icon" aria-hidden="true"> </span>
              <span class="profile__meta-value profile__meta-value--address">{{
                m.user.deliveryAddress?.trim() || "No Address"
              }}</span>
            </div> -->
          </div>
        </section>

        <section class="profile__about" aria-label="Opis">
          <h2 class="profile__section-title">Opis</h2>
          <!-- <p class="profile__about-text">
            {{ m.user.description?.trim() || "No Description" }}
          </p> -->
        </section>
      </article>
      } }
    </div>
  </div>
</div>
